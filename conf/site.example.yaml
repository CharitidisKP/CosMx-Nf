# Example of conf/site.yaml, this machine's settings, which cosmx-nf setup writes

# The Nextflow profile cosmx-nf launches with, server or slurm
profile: server

# The pipeline's Apptainer image, pulled by cosmx-nf setup or built from Environment/
sif: /path/to/cosmx-nf_0.1.0.sif

# The Python inside the image that Giotto calls through reticulate
container_python: /opt/py/bin/python
python_path: /opt/py/bin/python

# R libraries bound into the image for packages it does not carry, /none for none
r_libs_user: /none
r_libs: /none

# Host folders outside your home that the tasks read or write, comma-separated
bind: /path/to/data

# Sample sheet with the real data paths, kept out of git
input: assets/private/samplesheet.csv

# Folder of reference profiles, <name>.csv or .rds, default assets/profiles/
# profile_dir: /path/to/profiles

# Folder of NicheNet model files, default assets/nichenet/, empty skips NicheNet
# nichenet_model_dir: /path/to/nichenet
